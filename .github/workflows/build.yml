name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Windows executable
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Session-Manager-windows-x64
          path: dist/AI-Session-Manager.exe
